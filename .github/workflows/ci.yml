name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Fonts
        run: |
          Invoke-WebRequest -Uri "https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.zip" -OutFile "dejavu.zip"
          Expand-Archive "dejavu.zip" -DestinationPath "dejavu"
          $fonts = (New-Object -ComObject Shell.Application).Namespace(0x14)
          Get-ChildItem -Path "dejavu\dejavu-fonts-ttf-2.37\ttf" -Filter "*.ttf" | ForEach-Object { $fonts.CopyHere($_.FullName, 0x10) }
        shell: powershell

      - name: Restore
        run: dotnet restore PitLife.sln

      - name: Build
        run: dotnet build PitLife.sln --no-restore

      - name: Test
        run: dotnet test PitLife.sln --no-build --verbosity normal